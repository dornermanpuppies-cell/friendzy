# Supabase CLI configuration for Friendzy.
# Link to the hosted project with:  supabase link --project-ref gwdpsrjmfrgcloacvdlg
# Apply migrations with:            supabase db push
project_id = "friendzy"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = [
  "http://localhost:8081/auth/callback",
  "http://localhost:8081/auth/confirm",
  "friendzy://auth/callback",
  "friendzy://auth/confirm",
  "exp://127.0.0.1:8081/--/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 3600

[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30

# Functions called by external services authenticate with their own secrets
# (Supabase auth hook secret, RevenueCat header, Database Webhook header,
# LiveKit-signed JWT) instead of a Supabase user JWT.
[functions.send-email]
verify_jwt = false

[functions.revenuecat-webhook]
verify_jwt = false

[functions.push-dispatch]
verify_jwt = false

[functions.livekit-webhook]
verify_jwt = false
